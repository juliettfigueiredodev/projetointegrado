name: Integracao Continua - PI IV

on:
  push:
    branches:
      - main
      - andre
      - linderval
      - eduardo
  pull_request:
    branches:
      - main
      - andre
      - linderval
      - eduardo

jobs:
  lint-and-test:
    name: Lint & Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Verificação de sintaxe e lint (flake8)
        run: |
          # Interrompe a execução em caso de erros de sintaxe ou variáveis indefinidas
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Alertas de estilo PEP8 sem quebrar a pipeline
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verificação estática de tipos (Mypy)
        run: |
          pip install mypy
          mypy src/ --ignore-missing-imports
      
      - name: Executar testes automatizados (pytest)
        run: |
          pytest -v --tb=short

  validacao-deploy-vercel:
    name: Verificação de Integridade para Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais do Front-end e Deploy
        run: |
          echo "Verificando estrutura para o deploy na Vercel..."
          if [ ! -f "index.html" ] && [ ! -f "package.json" ] && [ ! -f "vercel.json" ] && [ ! -d "src" ]; then
            echo "Erro: Nenhum ponto de entrada encontrado para o deploy!"
            exit 1
          fi
          echo "Estrutura validada com sucesso!"
